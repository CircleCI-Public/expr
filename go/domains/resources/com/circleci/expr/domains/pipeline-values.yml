    defn: "The subject of the message in the last commit in the checkout branch."
  - name: "pipeline.git.commit.url"
    domain: urls
    defn: "The vcs provider url of the last commit in the checkout branch."
  - name: "pipeline.git.origin_repo_id"
  - name: "pipeline.git.origin_repo_url"
    domain: urls
  - name: "pipeline.git.repo_id"
    type: uint
    defn: "The vcs provider's identifier for the checkout repository."
    notes: "The uint type may not be an accurate choice generally."
  - name: "pipeline.git.repo_name"
    domain: git-repo-names
    defn: "The name of the checkout repository."
  - name: "pipeline.git.repo_owner"
    defn: "The vcs provider's name for the owner of the checkout repository."
  - name: "pipeline.git.repo_url"
    domain: urls
    defn: "The vcs provider url of the checkout repository."
  - name: "pipeline.git.revision"
    domain: git-shas
    defn: "The SHA of the last commit in the checkout branch."
  - name: "pipeline.git.ssh_checkout_url"
    domain: git-urls
    defn: "The git url of the repository hosted by the vcs provider."
    private: true
  - name: "pipeline.git.tag"
    domain: git-tags
    defn: "The name of the git tag being checked out. Not populated when checking out a branch."
  - name: "pipeline.git.target_repo_url"
    domain: urls
  - name: "pipeline.id"
    type: uuid
    domain: pipelines
    defn: "Identifies the triggered pipeline."
    source: builds-service
  - name: "pipeline.integration_source"
    domain: providers
    defn: "The pipeline type determined by checkout provider (e.g., github_app, github, bitbucket, bitbucket_dc, gitlab). Used by workflows-conductor to gate SSH key requirements, by execution to determine checkout strategy, and by notifications to determine commit status update behaviour."
    notes: "Used by the workflows conductor to determine if a build should be blocked due to a missing SSH key. Also used by notifications to determine how to do commit status updates."
  - name: "pipeline.name"
    defn: "Human-readable name of the pipeline definition, as stored in the config source record in soc-integrations."
  - name: "pipeline.number"
    type: uint
    defn: "Monotonically incrementing integer scoped to the project, assigned by builds-service at pipeline creation."
    source: builds-service
  - name: "pipeline.parameters.*"
    defn: "The set of customer parameters that characterizes the pipeline. Multiple such entries can be present, with the wildcard being a non-empty string and the value a string, number, or boolean."
