# This is the authoritative reference for pipeline value fields. It should
# eventually generate the following artifacts:
#
# * The default-pipeline-values var in
#   https://github.com/circleci/orb-service/blob/main/server/src/orb_service/constants.clj
# * The external docs
#   https://github.com/circleci/circleci-docs/blob/main/docs/guides/modules/ROOT/partials/pipelines-and-triggers/pipeline-values.adoc
# * The cli package config validation in
#   https://github.com/CircleCI-Public/circleci-cli/blob/main/config/pipeline.go#
#
# It should also be consistent with or replace:
#
# * Some internal docs
#   https://circleci.atlassian.net/wiki/spaces/PES/pages/7490338830/New+pipeline+values
# * Notifactions uses
#   https://circleci.atlassian.net/wiki/spaces/NOTIFY/pages/8019148862/Pipeline+Values
# * Pipelines uses
#   https://circleci.atlassian.net/wiki/spaces/CEI/pages/7089881300/Actor+Inputs+to+the+Pipelines+API
#
# These data are declared in the expr package so that exprs evaluated in a
# pipeline values context can have default (nil) values for all valid pipeline
# value fields, regardless of their presence in a build.
#
# Deprecation dates (deprecation_at):
#   2026-08-01 — GitHub App trigger_parameters migrated to pipeline.event.github.* / pipeline.git.*
#   2026-09-01 — Blocked on outbound webhooks migration; remove once webhooks no longer depend on these fields
#   2027-01-01 — Legacy trigger_parameters (circleci, git) and pipeline.project.git_url; needs deprecating, no replacement yet
#   2027-08-01 — GitLab trigger_parameters retained until GitLab consolidation completes

version: 1.0

# name: the primary name of the pipeline value
# type: the scalar type of the value, defaults to string
# domain: indicates constraints on valid types and specifies valid interpretations
# defn: the definition, generally a sentence fragment beginning with the implicit prefix "The $name field..." ending with a period, suitable for presentation to system operators and users
# aliases: a list of field aliases which repeat the pipeline value
# notes: from and for system operators, critical uses or confusing terminology
# private: boolean indicating the field is not publicly documented
# source: the system responsible for populating the field. The default is assumed to be soc-integrations or circle
fields:
  - name: "pipeline.config.file_path"
    defn: "The path to the CircleCI configuration file within the config repository, relative to the repo root."
  - name: "pipeline.config.ref"
    defn: "The full Git ref (e.g., refs/heads/main) used to fetch the configuration file from the config repository."
  - name: "pipeline.config.repository.name"
    defn: "The name of the config source repository, in the format owner/repo-name."
  - name: "pipeline.config.repository.url"
    defn: "The VCS provider URL of the config source repository."
  - name: "pipeline.config.sha"
    defn: "The Git SHA of the commit from which the configuration file was fetched."
  - name: "pipeline.config_source"
    domain: providers
    defn: "Specifies the provider of the pipeline build config."
    private: true
  - name: "pipeline.definition.id"
    type: uuid
    domain: config-sources
    defn: "Identifies the definition of the pipeline, including its checkout and config sources."
    notes: "This identifies a config_source record in soc-integrations."
  - name: "pipeline.deploy.component_name"
    defn: "The name of the deployable component targeted by this pipeline, injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.deploy.current_version"
    defn: "The version string of the currently deployed component, injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.deploy.environment_name"
    defn: "The name of the target deployment environment (e.g., production, staging), injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.deploy.namespace"
    defn: "The deployment namespace within the target environment, injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.deploy.reason"
    defn: "A string describing why the deployment or rollback was triggered, injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.deploy.target_version"
    defn: "The version string of the component to be deployed or rolled back to, injected by the deploy orchestration system."
    source: unknown
  - name: "pipeline.event.action"
    defn: "The specific action associated with the triggering event (e.g., opened, synchronize, closed for pull request events). For event types with no action subtype, this value is identical to pipeline.event.name."
  - name: "pipeline.event.circleci_actor_id"
    type: uuid
    domain: users
    private: true
  - name: "pipeline.event.context.github.pr_url"
    defn: "The HTML URL of the associated pull request: for push events, the open PR whose head branch was pushed to; for pull request events, the PR that triggered the event."
  - name: "pipeline.event.context.github.sha"
    domain: git-shas
    defn: "Identifies the commit to which the notification about the pipeline outcome will be sent."
  - name: "pipeline.event.github.after"
    defn: "The HEAD SHA of the branch after the push, from the GitHub push webhook payload's after field. Populated only for push events."
  - name: "pipeline.event.github.comment.body"
    defn: "The pull request comment body with leading/trailing whitespace removed, if a pipeline was triggered via PR comment. For pipelines triggered in other ways, this value is undefined."
    type: string
  - name: "pipeline.event.github.head_commit.url"
    defn: "The URL of the HEAD commit from the push webhook payload. Populated only for push events."
  - name: "pipeline.event.github.label.name"
    defn: 'The name of the label applied to the pull request, from the GitHub webhook payload. Only present for pull_request events whose "action" field value is "labeled".'
  - name: "pipeline.event.github.pull_request.base.ref"
    domain: git-branches
    defn: "The name of the base branch of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.base.sha"
    domain: git-shas
    defn: "The SHA of the HEAD of the base branch of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.draft"
    type: boolean
    defn: "Whether the pull request is in draft state, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.head.ref"
    domain: git-branches
    defn: "The name of the head branch of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.head.sha"
    domain: git-shas
    defn: "The SHA of the HEAD of the head branch of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.merged"
    type: boolean
    defn: "Whether the pull request has been merged, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.number"
    type: uint
    defn: "The numeric identifier of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.title"
    defn: "The title of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.pull_request.url"
    domain: urls
    defn: "The HTML URL of the pull request, from the GitHub webhook payload."
  - name: "pipeline.event.github.ref"
    defn: "The full Git ref (e.g., refs/heads/main, refs/tags/v1.0) from the GitHub push webhook payload's ref field. Populated only for push events."
  - name: "pipeline.event.github.repository.name"
    defn: "The repository name from the GitHub webhook payload's repository.name field."
  - name: "pipeline.event.github.repository.owner.login"
    defn: "The owner's GitHub login from the webhook payload's repository.owner.login field."
  - name: "pipeline.event.github.repository.url"
    defn: "The repository HTML URL from the GitHub webhook payload's repository.html_url field."
  - name: "pipeline.event.github.sender.avatar_url"
    defn: "The avatar URL of the GitHub user who sent the event, from the webhook payload's sender.avatar_url field."
  - name: "pipeline.event.github.sender.login"
    defn: "The GitHub login of the user who sent the event, from the webhook payload's sender.login field."
  - name: "pipeline.event.github.sender.type"
    defn: "The type of GitHub user that emitted the event triggering the pipeline. Possible values are User, Organization, and Bot."
    type: string
  - name: "pipeline.event.name"
    defn: "Normalized event name string indicating the trigger event type (e.g., push, pull_request, api, schedule)."
    notes: "Possibly an alias for pipeline.event.action"
  - name: "pipeline.event.provider_actor_id"
    defn: "Identifies the provider's user that triggered the pipeline."
    private: true
  - name: "pipeline.event.provider_login"
  - name: "pipeline.git.base_revision"
  - name: "pipeline.git.branch"
    domain: git-branches
    defn: "Specifies the git branch from which to checkout the project source."
  - name: "pipeline.git.branch.is_default"
    type: boolean
    defn: "Indicates that the git branch from which to checkout the project source is the repository's default branch."
