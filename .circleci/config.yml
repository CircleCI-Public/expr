version: 2.1

parameters:
  setup_go:
    type: string
    default: github.com/circleci-functions/setup-go@v0.5.3-4edeb2a

executors:
  default:
    docker:
      - image: cimg/base:current

  clj:
    docker:
      - image: cimg/clojure:1.12.6-openjdk-21.0

commands:
  setup:
    steps:
      - checkout
      - install-go
      - install-task

  install-go:
    steps:
      - run: circleci run << pipeline.parameters.setup_go >> --
          --version-file go.mod
          --golangci-lint-cache
          --checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'
      - run: go version

  install-task:
    steps:
      - run:
          name: Install go-task
          # The curlrc also makes the script's own release download retry.
          command: |
            export CURL_HOME="$(mktemp -d)"
            printf '%s\n' retry=5 retry-delay=2 retry-all-errors > "$CURL_HOME/.curlrc"
            curl --fail --silent --show-error --location https://taskfile.dev/install.sh -o "$CURL_HOME/install.sh"
            sh "$CURL_HOME/install.sh" -d -b "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  store_results:
    steps:
      - store_test_results:
          path: ./test-reports

jobs:
  clj-test:
    executor: clj
    steps:
      - checkout
      - run:
          name: Ensure corpus tests are generated
          command: |
            rm -r dev-resources/test-corpus dev-resources/evaluator-test-corpus
            lein generate-corpus
            if git diff --exit-code; then
              echo "Test corpus up to date"
            else
              echo "Regenerate corpus tests with 'rm -r dev-resources/test-corpus dev-resources/evaluator-test-corpus && lein generate-corpus' and check in the changes"
              exit 1
            fi
      - run: lein test
      - run: lein with-profile +cljfmt cljfmt check

  clj-deploy:
    executor: clj
    steps:
      - checkout
      - run:
          name: Compute version
          command: |
            set -o errexit
            set -o nounset
            version="1.0.<<pipeline.number>>-${CIRCLE_SHA1:0:7}"
            echo "export VERSION=\"${version}\"" >> ${CIRCLE_SHELL_ENV}
            echo $version
      - run: lein jar
      - run: lein with-profile +deploy deploy circle-s3

  go-check:
    executor: default
    steps:
      - setup
      - run: task ci:check
      - store_results

  go-test:
    executor: default
    steps:
      - setup
      - run: task ci:test
      - store_results

workflows:
  build-and-deploy:
    jobs:
      - go-check
      - go-test
      - clj-test
