version: 2.1

parameters:
  setup_go:
    type: string
    default: github.com/circleci-functions/setup-go@v0.5.3-4edeb2a

executors:
  default:
    docker:
      - image: cimg/base:current

  clj:
    docker:
      - image: cimg/clojure:1.12.6-openjdk-21.0
    working_directory: ~/project/clj

  ts:
    docker:
      - image: cimg/node:24.21.0
    working_directory: ~/project/ts

commands:
  setup:
    steps:
      - checkout
      - install-go
      - install-task

  install-go:
    steps:
      - run: circleci run << pipeline.parameters.setup_go >> --
          --version-file go.mod
          --golangci-lint-cache
          --key v2
          --checksum '{{ checksum "go.sum" }}_{{ checksum "tools/go.sum" }}'
      - run: go version

  install-task:
    steps:
      - run:
          name: Install go-task
          # The curlrc also makes the script's own release download retry.
          command: |
            export CURL_HOME="$(mktemp -d)"
            printf '%s\n' retry=5 retry-delay=2 retry-all-errors > "$CURL_HOME/.curlrc"
            curl --fail --silent --show-error --location https://taskfile.dev/install.sh -o "$CURL_HOME/install.sh"
            sh "$CURL_HOME/install.sh" -d -b "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  ts-install:
    steps:
      - run:
          name: Install pnpm
          command: |
            PNPM_VERSION=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)
            sudo npm install -g "pnpm@$PNPM_VERSION"
            pnpm --version
      - restore_cache:
          keys:
            - ts-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
      - run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - save_cache:
          key: ts-pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

  store_results:
    steps:
      - store_test_results:
          path: ./test-reports

jobs:
  clj-test:
    executor: clj
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Ensure corpus tests are generated
          command: |
            rm -r dev-resources/test-corpus dev-resources/evaluator-test-corpus
            lein generate-corpus
            if git diff --exit-code; then
              echo "Test corpus up to date"
            else
              echo "Regenerate corpus tests with 'cd clj && rm -r dev-resources/test-corpus dev-resources/evaluator-test-corpus && lein generate-corpus' and check in the changes"
              exit 1
            fi
      - run: lein test
      - run: lein with-profile +cljfmt cljfmt check

  clj-deploy:
    executor: clj
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Compute version
          command: |
            set -o errexit
            set -o nounset
            version="1.0.<<pipeline.number>>-${CIRCLE_SHA1:0:7}"
            echo "export VERSION=\"${version}\"" >> ${CIRCLE_SHELL_ENV}
            echo $version
      - run:
          name: Publish to Clojars
          command: lein deploy releases

  ts-test:
    executor: ts
    steps:
      - checkout:
          path: ~/project
      - ts-install
      - run:
          name: Ensure generated files are up to date
          command: |
            pnpm generate
            if git diff --exit-code; then
              echo "Generated files up to date"
            else
              echo "Regenerate with 'cd ts && pnpm generate' and check in the changes"
              exit 1
            fi
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:ci
      - store_test_results:
          path: test-reports
      - run: pnpm build

  ts-deploy:
    executor: ts
    steps:
      - checkout:
          path: ~/project
      - ts-install
      - run:
          name: Set version
          command: |
            version="0.1.<<pipeline.number>>"
            npm pkg set version="${version}"
            echo $version
      - run:
          name: Publish to npm
          # Scoped packages publish as restricted unless told otherwise.
          command: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            pnpm publish --access public --no-git-checks

  go-check:
    executor: default
    steps:
      - setup
      - run: task ci:check
      - store_results

  go-test:
    executor: default
    steps:
      - setup
      - run: task ci:test
      - store_results


  go-deploy:
    executor: default
    steps:
      - setup
      - run: task ci:deploy

  ok-to-deploy:
    type: no-op

workflows:
  build-and-deploy:
    jobs:
      - go-check
      - go-test
      - clj-test
      - ts-test
      - ok-to-deploy:
          filters:
            branches:
              only: main
          requires:
            - go-check
            - go-test
            - clj-test
            - ts-test
      - clj-deploy:
          context: clojars-publish
          requires:
            - ok-to-deploy
      - ts-deploy:
          context: cci-config-sdk-publishing
          requires:
            - ok-to-deploy
      - go-deploy:
          context: devex-release
          requires:
            - ok-to-deploy
